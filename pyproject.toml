[project]
name = "simon-watchmakers"
version = "1.0.0"
description = "A computational re-examination of Simon's watchmakers parable from The Architecture of Complexity (1962)"
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-4.0"
authors = [
    { name = "Peter Dresslar", email = "peterdresslar@gmail.com" },
]
dependencies = [
    "altair>=6.0.0",
    "marimo",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
